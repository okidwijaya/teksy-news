<svg viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
    <!-- Background gradient -->
    <defs>
        <linearGradient id="loadingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="loadingAccent" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
        </linearGradient>

        <!-- Shimmer effect -->
        <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:rgba(255,255,255,0);stop-opacity:0" />
            <stop offset="50%" style="stop-color:rgba(255,255,255,0.3);stop-opacity:1" />
            <stop offset="100%" style="stop-color:rgba(255,255,255,0);stop-opacity:0" />
            <animateTransform
                attributeName="gradientTransform"
                type="translate"
                values="-400 0; 400 0; -400 0"
                dur="2s"
                repeatCount="indefinite" />
        </linearGradient>
    </defs>

    <!-- Main logo background with pulse animation -->
    <rect x="10" y="10" width="380" height="100" rx="15" fill="url(#loadingGradient)">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite" />
    </rect>

    <!-- Animated newspaper icon -->
    <g transform="translate(30, 25)">
        <rect x="0" y="0" width="40" height="52" rx="4" fill="white" opacity="0.9">
            <animate attributeName="opacity" values="0.7;0.9;0.7" dur="2s" repeatCount="indefinite" />
        </rect>

        <!-- Header bar with slide animation -->
        <rect x="4" y="6" width="32" height="4" rx="2" fill="url(#loadingAccent)">
            <animate attributeName="width" values="0;32;32" dur="1s" repeatCount="indefinite" />
        </rect>

        <!-- Content lines with staggered animation -->
        <rect x="4" y="14" width="20" height="2" rx="1" fill="white" opacity="0.7">
            <animate attributeName="width" values="0;20;20" dur="1.2s" begin="0.2s"
                repeatCount="indefinite" />
        </rect>
        <rect x="4" y="20" width="24" height="2" rx="1" fill="white" opacity="0.7">
            <animate attributeName="width" values="0;24;24" dur="1.2s" begin="0.4s"
                repeatCount="indefinite" />
        </rect>
        <rect x="4" y="26" width="16" height="2" rx="1" fill="white" opacity="0.7">
            <animate attributeName="width" values="0;16;16" dur="1.2s" begin="0.6s"
                repeatCount="indefinite" />
        </rect>
        <rect x="4" y="32" width="28" height="2" rx="1" fill="white" opacity="0.7">
            <animate attributeName="width" values="0;28;28" dur="1.2s" begin="0.8s"
                repeatCount="indefinite" />
        </rect>
        <rect x="4" y="38" width="22" height="2" rx="1" fill="white" opacity="0.7">
            <animate attributeName="width" values="0;22;22" dur="1.2s" begin="1s"
                repeatCount="indefinite" />
        </rect>
        <rect x="4" y="44" width="18" height="2" rx="1" fill="white" opacity="0.7">
            <animate attributeName="width" values="0;18;18" dur="1.2s" begin="1.2s"
                repeatCount="indefinite" />
        </rect>
    </g>

    <!-- Main text "KITA" with typewriter effect -->
    <text x="100" y="68" font-family="Arial, sans-serif" font-size="48" font-weight="bold"
        fill="white">
        <animate attributeName="opacity" values="0;1;1;1" dur="2s" repeatCount="indefinite" /> KITA </text>

    <!-- Pulsing accent dot -->
    <circle cx="235" cy="55" r="6" fill="url(#loadingAccent)">
        <animate attributeName="r" values="4;8;4" dur="1s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;1;0.8" dur="1s" repeatCount="indefinite" />
    </circle>

    <!-- Subtitle "Kickstart Ideas Transform Applications" with fade in -->
    <text x="245" y="48" font-family="Arial, sans-serif" font-size="13" font-weight="normal"
        fill="white" opacity="0.85">
        <animate attributeName="opacity" values="0;0.85;0.85" dur="2.5s" repeatCount="indefinite" />
        Kickstart Ideas </text>
    <text x="245" y="65" font-family="Arial, sans-serif" font-size="13" font-weight="normal"
        fill="white" opacity="0.85">
        <animate attributeName="opacity" values="0;0.85;0.85" dur="2.5s" repeatCount="indefinite" />
        Transform Applications </text>

    <!-- Shimmer overlay effect -->
    <rect x="10" y="10" width="380" height="100" rx="15" fill="url(#shimmer)" />

    <!-- Subtle border with glow -->
    <rect x="10" y="10" width="380" height="100" rx="15" fill="none" stroke="rgba(255,255,255,0.3)"
        stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.1;0.3;0.1" dur="2s"
            repeatCount="indefinite" />
    </rect>

    <!-- Loading dots -->
    <g transform="translate(170, 100)">
        <circle cx="0" cy="0" r="3" fill="white" opacity="0.6">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite" />
        </circle>
        <circle cx="12" cy="0" r="3" fill="white" opacity="0.6">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.2s"
                repeatCount="indefinite" />
        </circle>
        <circle cx="24" cy="0" r="3" fill="white" opacity="0.6">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.4s"
                repeatCount="indefinite" />
        </circle>
    </g>
</svg>